<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="__BYM_CSP__" />
    <title>BYM Office: a read-only viewer</title>
    <style>
      html, body { height: 100%; margin: 0; }
      #viewer { height: 100%; }
    </style>
  </head>
  <body>
    <div id="viewer"></div>

    <script src="../bymoffice.min.js"></script>
    <script>
      const locale = new URLSearchParams(location.search).get('lang') === 'tr' ? 'tr' : 'en';

      BymOffice.mount(document.getElementById('viewer'), {
        file: `../samples/sample-doc-${locale}.docx`,
        locale,
        readOnly: true, // shown, selected and copied, never changed
        zoom: 'fit-width',
      })
        .then((mounted) => {
          window.mounted = mounted;
        })
        .catch((error) => {
          document.getElementById('viewer').textContent = error.message;
        });
    </script>
  </body>
</html>
