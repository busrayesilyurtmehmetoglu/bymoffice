# Publishes the demo site (site/ -> site-dist/, see scripts/build-site.mjs) to GitHub Pages
# on every push to main. GitHub Pages has to be enabled for the repository with
# "GitHub Actions" as its source.
name: Demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time; a newer push does not cancel one that is being published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A private repository has no Pages site: the run is skipped there instead of failing.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # package.json names no packageManager; the lockfile is of pnpm 9 and later.
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
