<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BYM Office — editor page</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font: 14px system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #bar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 10px;
        border-bottom: 1px solid #d0d7de;
        background: #f6f8fa;
      }
      #name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #status {
        color: #57606a;
      }
      #status[data-kind='error'] {
        color: #b42318;
      }
      button {
        font: inherit;
        padding: 4px 12px;
      }
      #editor {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <!--
      One page that shows a Word or Excel file in the editor and sends it back
      when it is saved. An application opens it in a tab or in an <iframe>:

        index.html?file=/files/42/download&save=/files/42&name=report.xlsx&lang=tr
        index.html?file=/files/42/download&mode=view          read-only
        index.html?new=docx&save=/files&name=letter.docx      a new, empty document

      file   where the file is fetched from (same origin as this page)
      save   where the saved bytes are sent with PUT (same origin); without it "Save" downloads the file
      mode   "edit" (default) or "view"
      lang   "tr" or "en": the language of the editor and of a new file
      new    "docx" or "xlsx": start from an empty file instead of fetching one
      convert  "1": open doc, RTF and xls files for editing by converting them to docx / xlsx.
               The saved file is then of the new format: the request says which in the
               X-Bym-Format header (and the old one in X-Bym-Converted-From), and the name
               shown gets the new extension.
      name   the file name shown, and used for a download

      Saving is the editor's own: the page only says where to (the `saveTo` option of mount()).
      The Save button is in the editor's toolbar, Ctrl+S / Cmd+S does the same, the request
      carries the bytes with the media type of their format, and leaving the page with changes
      that were not saved asks first. When the address the file is saved to is the one it was
      fetched from and the server sent an ETag with it, the request carries If-Match, and the
      server can refuse to overwrite somebody else's changes with 412.

      Inside an <iframe> the page tells its parent what happens:
        { source: 'bymoffice', type: 'ready' | 'changed' | 'saved' | 'error', message?, format?, convertedFrom? }

      In production load the script from your own server or from a CDN:
        <script src="https://cdn.jsdelivr.net/npm/bymoffice/dist/bymoffice.min.js"></script>

      Fonts: text set in Bookman Old Style is drawn with the font the package brings (TeX Gyre Bonum)
      on devices without Bookman Old Style. Its files are fetched from the folder fonts/ next to the
      script, only when a file needs them. Serving the script yourself, copy that folder with it
      (dist/fonts/); if it lives elsewhere, or the engine is imported as a module or bundled, say
      where: BymOffice.mount(el, { fontsUrl: '/my/fonts/' }). `fontsUrl: null` turns the font off.
    -->
    <div id="bar">
      <span id="name"></span>
      <span id="status" role="status"></span>
      <!-- Opens the browser's print dialog, which can also save a PDF. -->
      <button id="print" type="button" hidden>Print</button>
    </div>
    <div id="editor"></div>

    <script src="../../dist/bymoffice.min.js"></script>
    <script>
      (function () {
        'use strict';
        var params = new URLSearchParams(location.search);
        var lang = params.get('lang') === 'tr' ? 'tr' : 'en';
        var readOnly = params.get('mode') === 'view';
        var text = {
          en: { print: 'Print', saving: 'Saving…', saved: 'Saved', changed: 'Not saved', loading: 'Loading…', notHere: 'Only files of this site can be opened', nothing: 'No file was given' },
          tr: { print: 'Yazdır', saving: 'Kaydediliyor…', saved: 'Kaydedildi', changed: 'Kaydedilmedi', loading: 'Yükleniyor…', notHere: 'Yalnız bu sitenin dosyaları açılabilir', nothing: 'Dosya verilmedi' },
        }[lang];

        var statusEl = document.getElementById('status');
        var printButton = document.getElementById('print');
        printButton.textContent = text.print;
        document.documentElement.lang = lang;

        function tell(type, message) {
          // The parent page of an <iframe>, on the same site only.
          if (window.parent === window) return;
          var data = { source: 'bymoffice', type: type, message: message };
          if (mounted) {
            data.format = mounted.file.format;
            if (mounted.conversion) data.convertedFrom = mounted.conversion.from;
          }
          window.parent.postMessage(data, location.origin);
        }
        function status(message, kind) {
          // Text from a file or a server is shown as text, never as HTML.
          statusEl.textContent = message;
          statusEl.setAttribute('data-kind', kind || 'info');
        }
        function fail(message) {
          status(message, 'error');
          tell('error', message);
        }
        // Addresses come from the query string: only this site is fetched from and sent to.
        function ownAddress(value) {
          if (!value) return null;
          try {
            var url = new URL(value, location.href);
            return url.origin === location.origin ? url.href : undefined;
          } catch (error) {
            return undefined;
          }
        }

        var fresh = params.get('new');
        var fileUrl = ownAddress(params.get('file'));
        var saveUrl = ownAddress(params.get('save'));
        if (fresh !== 'docx' && fresh !== 'xlsx') fresh = null;
        // Without a name: the last part of the path the file comes from, not of its query.
        var fetched = '';
        try {
          fetched = fileUrl ? decodeURIComponent(new URL(fileUrl).pathname.split('/').pop() || '') : '';
        } catch (error) {
          fetched = '';
        }
        var name = params.get('name') || (fresh ? 'new.' + fresh : fetched || 'file');
        document.getElementById('name').textContent = name;
        document.title = name;

        if (fileUrl === undefined || saveUrl === undefined) return fail(text.notHere);
        if (!fresh && !fileUrl) return fail(text.nothing);

        var mounted;
        // No server to send it to: the browser downloads the file. A function is the page saving by itself.
        function download(bytes) {
          var link = document.createElement('a');
          link.href = URL.createObjectURL(new Blob([bytes]));
          link.download = name;
          link.click();
          setTimeout(function () {
            URL.revokeObjectURL(link.href);
          }, 1000);
        }
        // What the editor says about saving: the page shows it, and tells its parent.
        var savedAt;
        var failure;
        function saveState(state) {
          if (state.saving) return status(text.saving);
          if (state.error) {
            if (state.error !== failure) fail(state.error);
            failure = state.error;
            return;
          }
          failure = undefined;
          // What was typed while the file was on its way is not in it: there is still something to save.
          if (state.dirty) return status(text.changed);
          if (state.lastSavedAt !== undefined && state.lastSavedAt !== savedAt) {
            savedAt = state.lastSavedAt;
            status(text.saved);
            tell('saved');
          }
        }
        function changed() {
          tell('changed');
        }

        status(text.loading);
        var noticed = false;
        var source = fresh ? BymOffice.createBlank(fresh, { locale: lang }) : Promise.resolve(fileUrl);
        source
          .then(function (file) {
            return BymOffice.mount(document.getElementById('editor'), {
              file: file,
              locale: lang,
              readOnly: readOnly,
              convert: params.get('convert') === '1',
              // Where "Save" in the toolbar and Ctrl+S / Cmd+S send the file. A file that cannot be
              // written (doc, RTF or xls that was not converted) has no Save, whatever is said here.
              // allowConverted: with convert=1 the server of this page expects a docx / xlsx where a doc, RTF or xls
              // was (it reads X-Bym-Format); without it a converted file is not saved to the address it came from.
              // A redirect (a session that ran out) is never followed: the save fails, and the status line says so.
              saveTo: readOnly ? false : saveUrl ? { url: saveUrl, allowConverted: true } : download,
              onSaveState: saveState,
              // A workbook reports its changes through onChange, a document through onDocumentChange.
              onChange: changed,
              onDocumentChange: changed,
              onNotice: function (notice) {
                noticed = true;
                status(notice.message, notice.kind);
              },
            });
          })
          .then(function (result) {
            mounted = result;
            if (result.conversion) {
              // "report.doc" is now a docx: the name says so, here and in a download. Only the extension of
              // a format that is converted is taken off ("Report 2024.10" and "offer.v2" keep their ends).
              name = name.replace(/\.(doc|rtf|xls)$/i, '') + '.' + result.conversion.to;
              document.getElementById('name').textContent = name;
              document.title = name;
            }
            // Documents and workbooks can be printed, read-only or not.
            printButton.hidden = false;
            printButton.addEventListener('click', function () {
              // The editor says by itself (onNotice) what goes wrong; the promise ends when the dialog is closed.
              // A workbook: the sheet that is shown; the name of the file is what "&F" in a header stands for.
              var job = result.kind === 'document' ? result.print() : result.print({ fileName: name });
              job.catch(function () {});
            });
            // What was said while the file was opened (it was converted, or could not be) stays until something else is said.
            if (!noticed) status('');
            // For the console, and for tests of this page.
            window.bymEditor = result;
            tell('ready');
          })
          .catch(function (error) {
            fail(String((error && error.message) || error));
          });
      })();
    </script>
  </body>
</html>
